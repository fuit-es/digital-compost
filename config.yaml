simulation:
  window:
    width: 1200
    height: 1000
    ui_bar_height: 60
  fps: 60
  gravity_x: 0
  gravity_y: 0
  chunk_velocity_min: -200
  chunk_velocity_max: 200
  torus_world: false
  buttons:
    width: 120
    height: 40
    gap: 10

worm:
  max_chunks: 100
  appetite:
    min_difference: 0.7
    max_difference: 1
    hue_weight: 0.6
    saturation_weight: 0.2
    value_weight: 0.2
  display_area:
    x: 10
    y: 70  # Just below the UI bar
    width: 200
    height: 400
  history_panel:
    chunk_preview_size: 50
    text_height: 20
    spacing: 10

segmentation:
  # --- Felzenszwalb Segmentation ---
  # Hyperparameters to adjust:
  # scale (int, default: 100), sigma (float, default: 0.8), min_size (int, default: 20)
  # Increase scale -> fewer segments; Decrease scale -> more segments
  # Increase sigma -> smoother image, fewer segments; Decrease sigma -> sharper details
  # Increase min_size -> larger minimum segments; Decrease min_size -> smaller segments
  felzenszwalb:
    scale: 100
    sigma: 3
    min_size: 20

compression:
  max_size: 10000
  min_entropy: 10
  downsample_factor: 0.1

colors:
  BLACK: [0, 0, 0]
  WHITE: [255, 255, 255]
  DARK_GRAY: [70, 70, 70]
  UI_BG: [30, 30, 30]
  RED: [255, 0, 0]
  PANEL_BG: [40, 40, 40]